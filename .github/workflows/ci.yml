name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Validated at import by src/lib/env.ts, including during `next build`.
      # Placeholders only — nothing here is a real secret.
      MONGODB_URI: mongodb://127.0.0.1:27017/mba-antisocial-ci
      AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      # A throwaway database for the integration tests; it is dropped.
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/mba-antisocial-test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
