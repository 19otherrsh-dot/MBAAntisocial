# Runs the reminder job every hour.
#
# Vercel's free plan only allows once-a-day cron jobs (vercel.json schedules a
# daily run as a fallback). This workflow calls the same endpoint hourly so
# "your session is in an hour" reminders arrive on time. It does nothing until
# both repository secrets are set: Settings → Secrets and variables → Actions →
#   APP_URL      e.g. https://your-app.vercel.app
#   CRON_SECRET  the same value as the app's CRON_SECRET
name: Reminders

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reminders"
